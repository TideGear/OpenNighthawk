; f117a.ini - copy this file beside f117a.exe as f117a.ini and edit it.
; Remove the ; in front of a line to use it. Relative paths are taken from
; this file's folder, and an option given on the command line still wins.

; Where the game is installed (the folder holding F117.COM).
;data = D:\GOG\F-117A

; Roland music, used when you answer 3 (Roland) at the game's sound question:
;   munt    - MT-32 emulation, the sound the game was written for;
;             needs your MT-32 ROMs in the mt32-roms folder
;   windows - the Windows MIDI synthesizer (General MIDI: wrong instruments)
;roland = munt
;mt32-roms = C:\ROMs

; The window.
;scale = 3
;fullscreen = no

; Fixes for the original's bugs (f117a --list-fixes), as a list.
;fix = D4, D5
