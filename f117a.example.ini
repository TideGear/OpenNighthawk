; f117a.ini - copy this file beside f117a.exe as f117a.ini and edit it.
; Remove the ; in front of a line to use it. Relative paths are taken from
; this file's folder, and an option given on the command line still wins.

; Where the game is installed (the folder holding F117.COM). Only needed if
; it is somewhere unusual: the common GOG and Steam folders are found anyway.
;data = C:\GOG Games\F-117A

; Roland music, used when you answer 3 (Roland) at the game's sound question:
;   munt    - MT-32 emulation, the sound the game was written for;
;             needs your MT-32 control and PCM ROMs in the mt32-roms folder
;             (recognised by content, any file names; the README lists
;             the supported ROMs and their SHA-1s)
;   windows - the Windows MIDI synthesizer (General MIDI: wrong instruments)
;roland = munt
;mt32-roms = C:\ROMs

; The PC speaker's digitised speech (the radio calls under the speaker and
; Roland drivers is pulse-width modulation at about 15 kHz):
;   realsound - the modulation without its carrier, as GOG DOSBox plays it
;   pwm       - the pulse train itself, carrier included, as the PC sends it
;speaker = realsound

; The window.
;scale = 3
;fullscreen = no

; The picture in flight:
;   scan   - what the emulated VGA scanned out
;   replay - the same picture redrawn from the original's draw records (a
;            step towards 60 fps and 4K; docs/presentation.md)
;   interp - in-between frames of the original's steps at the display's
;            rate, a step behind (320x200)
;present = scan

; With replay or interp: the picture N times finer (2 to 16; 9 fills a 4K
; screen's 2160 lines at 4:3). The 3-D scene's polygons are redrawn from
; their vertices; text, the HUD and sprites are scaled copies.
;present-scale = 1

; With interp: the picture's age. interp trails the original by one step and
; is exact at its frames; extrapolate shows each step when the original
; draws it and predicts in between, which can overshoot a sudden change.
;present-age = interp

; Fixes for the original's bugs (f117a --list-fixes), as a list.
;fix = D4, D5
