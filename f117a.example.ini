; f117a.ini - copy this file beside f117a.exe as f117a.ini and edit it.
; Each line is a command-line option without its dashes; an option given on
; the command line still wins. Lines starting with ; or # are comments.
; Relative paths are taken from this file's folder.

; Where the game is installed (the folder holding F117.COM).
;data = D:\GOG\F-117A

; Roland music: either Munt with your MT-32 ROMs ...
;mt32-control = C:\ROMs\mt32_ctrl_1_07.rom
;mt32-pcm = C:\ROMs\mt32_pcm.rom
; ... or Windows MIDI (-1 is the MIDI mapper). Choose one.
;midi = -1

; The window.
;scale = 3
;fullscreen = no
;no-aspect = no

; Fixes for the original's bugs (f117a --list-fixes), as a list.
;fix = D4, D5
