; f117a.ini - copy this file beside f117a.exe as f117a.ini and edit it.
; Remove the ; in front of a line to use it. Relative paths are taken from
; this file's folder, and an option given on the command line still wins.

; Where the game is installed (the folder holding F117.COM). Only needed if
; it is somewhere unusual: the common GOG and Steam folders are found anyway.
;data = C:\GOG Games\F-117A

; Roland music, used when you answer 3 (Roland) at the game's sound question:
;   munt    - MT-32 emulation, the sound the game was written for;
;             needs your MT-32 control and PCM ROMs in the mt32-roms folder
;             (recognised by content, any file names; the README lists
;             the supported ROMs and their SHA-1s)
;   windows - the Windows MIDI synthesizer (General MIDI: wrong instruments)
;roland = munt
;mt32-roms = C:\ROMs

; The PC speaker's digitised speech (the radio calls under the speaker and
; Roland drivers is pulse-width modulation at about 15 kHz):
;   realsound - the modulation without its carrier, as GOG DOSBox plays it
;   pwm       - the pulse train itself, carrier included, as the PC sends it
;speaker = realsound

; The emulated PC's speed:
;   dosbox - this machine's instruction model, run at 60 million instructions a second
;            (the default; ips = 9000000 is GOG DOSBox's reference setting).
;            D1REAL separately controls simulation cadence: fifteen by default.
;   386    - a 386DX/33 of 1991: 5-9 frames a second, the original's pace
;timing = dosbox

; D1REAL cadence (normal play enables that fix). Fifteen is the default:
; 15 updates/s normally and 30 at 2x time compression, with ips = 60000000.
; The 40-million budget falls behind in compressed flight. To restore the
; previous play mode, use sim-hz = 8 and ips = 20000000. Replays use their
; recorded cadence, including eight for older logs, ahead of this setting.
;sim-hz = 15

; The window.
;scale = 3
;fullscreen = no

; The picture in flight. interp and rerun raise the frame rate: the window
; shows one picture per display refresh (vsync), so the frame rate is the
; refresh rate set for the display in Windows (60 Hz: 60 fps; 144 Hz: 144
; fps), if the PC keeps up. The game itself still steps at its own rate
; (fifteen a second with the default D1REAL); extra pictures fall between its steps, one step
; behind. scan and replay show a new picture only when the game draws one.
; Every mode but scan is experimental and keeps the original renderer's
; quirks (jittering edges, objects drawn in the wrong order, lines and dots
; the same thickness at any distance).
;   scan   - what the emulated VGA scanned out
;   replay - the same picture redrawn from the original's draw records (a
;            step towards 60 fps and 4K; docs/presentation.md)
;   interp - in-between frames of the original's steps at the display's
;            rate, a step behind (use present-scale for a finer picture)
;   rerun  - in-between frames drawn by the original itself on a copy of
;            the machine at each in-between moment (no guessing between
;            frames), a step behind; the game itself is never touched
;present = scan

; With replay, interp or rerun: the picture N times finer (2 to 16; 9 fills a 4K
; screen's 2160 lines at 4:3). The 3-D scene's polygons are redrawn from
; their vertices; HUD lines and ticks are redrawn on the output grid.
; Original text glyphs, sprites and cockpit artwork keep their pixel blocks.
;present-scale = 1

; HUD line thickness in output pixels, as in the Reimp. 0 (default) uses
; present-scale; 1 is a thin stroke. Range 0 to 20; scale 1 stays exact.
;present-line-width = 0

; With interp or rerun: the picture's age. interp trails the original by one step and
; is exact at its frames; extrapolate shows each step when the original
; draws it and predicts in between, which can overshoot a sudden change.
;present-age = interp

; The two re-release settings. presentation is the picture as one choice:
; original (the exact 320x200 picture, sharp, 4:3; the default) or enhanced
; (rerun at the display's refresh rate, as fine as the display allows at 4:3).
; fixes is the fix set as one choice: original (every fix off), recommended
; (the normal-play fixes; the default) or custom (none, plus the fix = lines you
; give; the settings menu's Choose fixes screen writes them). present and fix lines
; after them refine the choice.
;presentation = enhanced
;fixes = recommended

; Normal play enables all fixes, including D1REAL and D1PROX.
; List them with f117a --list-fixes. Use none for the original behavior.
; To select a subset, put fix = none before a second fix = D4, D5 line.
; Recorded sessions restore their recorded set; old logs have no fixes.
;fix = none

; Everything below can also be set in the game: press Ctrl+Alt+S for the settings
; menu (it pauses the game, saves to this file and offers a restart), Ctrl+Alt+K
; for the game's key list.

; Scanlines on the picture, as on a monitor (4:3 pictures only).
;crt = yes

; Show the radio calls ("cleared for take off") as text. Works with the Roland and
; PC speaker sound drivers, not AdLib. Needs the game's own SPEECH.117.
;subtitles = yes

; Make one key act as another: Q:W makes the Q key do what W does. Names are SDL's
; ("A", "Left Shift", "F5", "Keypad 4"); several pairs go on one line.
;remap = Q:W, Left Shift:Space

; The controller: a dead zone in percent of travel (0 to 50), turning an axis
; round, and which controller buttons fire the guns (numbers from 0; the default
; is 0 and 1).
;pad-deadzone = 10
;pad-invert-y = yes
;pad-fire1 = 0
;pad-fire2 = 1
