name: Windows build and ROM-free tests

on:
  push:
    branches: [master]
    # Prose only: nothing builds or tests from these, and a doc commit that
    # started a run would cancel the code commit's run before it finished.
    paths-ignore:
      - 'docs/presentation.md'
      - 'docs/roadmap.md'
      - 'docs/architecture.md'
      - 'docs/provenance.md'
      - 'docs/parity-audit.md'
      - 'handoff.md'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Commits are pushed one verified piece at a time, often minutes apart. Only
# the newest commit on a branch needs testing: a newer push cancels the run
# still in progress or queued for the same branch, which also keeps the
# account's hosted runners from being saturated (queued jobs then time out
# with "not acquired by Runner", which reads as a failure).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  munt:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: munt/munt
          ref: 6e7c01fba7e1d50c8fa705834889fd0eac136075
          path: .munt
          persist-credentials: false
      - name: Configure optional Munt build without ROMs
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DF117R_WITH_MT32EMU=ON "-DF117R_MT32EMU_SOURCE=${{ github.workspace }}/.munt/mt32emu"
      - name: Build application, MIDI renderer and tests
        run: cmake --build build --config Release --parallel
      - name: ROM-free Munt and audio checks
        run: ctest --test-dir build --build-config Release --output-on-failure
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install picture comparator dependency
        run: python -m pip install Pillow numpy
      - name: Configure full interpreter build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DF117R_GEN_DIR= -DF117R_BUILD_APP=ON -DF117R_BUILD_TESTS=ON
      - name: Build application, headless runner and tests
        run: cmake --build build --config Release --parallel
      - name: CPU and machine tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Application stall and resume pacing
        run: python tools/host_timing.py --out "$env:RUNNER_TEMP/host-timing"
      - name: Preserve pacing diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-timing
          path: ${{ runner.temp }}/host-timing
      - name: Music comparator regressions
        run: python tests/test_music_compare.py
      - name: Picture comparator regressions
        run: python tests/test_video_compare.py
      - name: Route milestone regressions
        run: python tests/test_route_checks.py
      - name: Machine control API regressions
        run: python tests/test_machine_api.py
      - name: Landing acceptance regressions
        run: python tests/test_landing_checks.py
      - name: Reconnaissance acceptance regressions
        run: python tests/test_recon_checks.py
      - name: Ground-strike acceptance regressions
        run: python tests/test_strike_checks.py
      - name: Secret-airstrip acceptance regressions
        run: python tests/test_airstrip_checks.py
      - name: Supply-drop impact regressions
        run: python tests/test_cargo_checks.py
      - name: Mission candidate input regressions
        run: python tests/test_mission_candidates.py
      - name: Earned-career verdict regressions
        run: python tests/test_career_checks.py
      - name: Reference observer and audio verdict regressions
        run: python tests/test_parity_diagnostics.py
      - name: Recompiler override-site regressions
        run: python tests/test_recompiler_overrides.py
      - name: Run-slicing invariance regressions
        run: python tests/test_run_slicing.py
